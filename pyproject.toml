[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsync-lab"
version = "0.1.0"
description = "Two-way clipboard sync prototype (text + images) for GNOME Wayland <-> Android"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
clipsync = "clipsync.daemon:main"
clipsync-relay = "clipsync.relay_cli:main"
clipsync-peer = "clipsync.peer:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["clipsync", "meshcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "exploratory: exploratory checks that are not part of the frozen acceptance gate",
]
